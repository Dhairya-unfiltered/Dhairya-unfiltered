<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="title desc">
  <title id="title">Dhairya Shah</title>
  <desc id="desc">Dhairya Shah and a retry code loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020304"/><stop offset="0.58" stop-color="#070b10"/><stop offset="1" stop-color="#021216"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#14202a" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="240" rx="18" fill="url(#grid)" opacity="0.52"/>
  <rect x="22" y="22" width="1236" height="196" rx="14" fill="#05080c" fill-opacity="0.88" stroke="#22303c"/>
  <text x="70" y="137" fill="#f8fafc" font-family="Consolas, Menlo, monospace" font-size="50" font-weight="700" letter-spacing="2">DHAIRYA SHAH</text>
  <rect x="72" y="160" width="420" height="3" rx="2" fill="url(#accent)"/>
  <rect x="748" y="52" width="450" height="136" rx="10" fill="#020406" stroke="#1e3a44"/>
  <text x="784" y="92" fill="#c084fc" font-family="Consolas, Menlo, monospace" font-size="21">while</text>
  <text x="853" y="92" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="21">(!success) {</text>
  <text x="821" y="132" fill="#67e8f9" font-family="Consolas, Menlo, monospace" font-size="21">try</text>
  <text x="860" y="132" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="21">();</text>
  <text x="784" y="172" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="21">}</text>
  <rect x="22" y="210" width="1236" height="8" rx="4" fill="url(#accent)"/>
</svg>