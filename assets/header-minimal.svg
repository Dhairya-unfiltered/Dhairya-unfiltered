<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Dhairya Shah</title>
  <desc id="desc">Dhairya Shah with a retry code loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020304"/>
      <stop offset="0.55" stop-color="#070b10"/>
      <stop offset="1" stop-color="#021216"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#14202a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="280" rx="18" fill="url(#grid)" opacity="0.58"/>
  <rect x="24" y="24" width="1232" height="232" rx="14" fill="#05080c" fill-opacity="0.88" stroke="#22303c"/>
  <text x="72" y="158" fill="#f8fafc" font-family="Consolas, Menlo, monospace" font-size="52" font-weight="700" letter-spacing="2">DHAIRYA SHAH</text>
  <rect x="74" y="184" width="430" height="3" rx="2" fill="url(#line)"/>
  <rect x="744" y="69" width="450" height="143" rx="10" fill="#020406" stroke="#1e3a44"/>
  <text x="780" y="111" fill="#c084fc" font-family="Consolas, Menlo, monospace" font-size="22">while</text>
  <text x="852" y="111" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">(!success) {</text>
  <text x="820" y="153" fill="#67e8f9" font-family="Consolas, Menlo, monospace" font-size="22">try</text>
  <text x="860" y="153" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">();</text>
  <text x="780" y="195" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">}</text>
  <rect x="24" y="248" width="1232" height="8" rx="4" fill="url(#line)"/>
</svg>