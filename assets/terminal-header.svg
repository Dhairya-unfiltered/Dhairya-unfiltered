<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Dhairya Shah</title>
  <desc id="desc">Static black developer banner with a retry code loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020304"/>
      <stop offset="0.55" stop-color="#070b10"/>
      <stop offset="1" stop-color="#031014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#16212b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" rx="20" fill="url(#background)"/>
  <rect width="1280" height="300" rx="20" fill="url(#grid)" opacity="0.55"/>
  <rect x="22" y="22" width="1236" height="256" rx="16" fill="#05080c" fill-opacity="0.88" stroke="#22303c"/>
  <path d="M 22 70 H 1258" stroke="#22303c"/>

  <circle cx="54" cy="46" r="6" fill="#ff5f57"/>
  <circle cx="76" cy="46" r="6" fill="#febc2e"/>
  <circle cx="98" cy="46" r="6" fill="#28c840"/>

  <text x="74" y="164" fill="#f8fafc" font-family="Consolas, Menlo, monospace" font-size="52" font-weight="700" letter-spacing="2">DHAIRYA SHAH</text>
  <rect x="76" y="190" width="430" height="3" rx="2" fill="url(#accent)"/>

  <rect x="750" y="92" width="450" height="145" rx="10" fill="#020406" stroke="#1e3a44"/>
  <text x="785" y="132" fill="#c084fc" font-family="Consolas, Menlo, monospace" font-size="22">while</text>
  <text x="857" y="132" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">(!success) {</text>
  <text x="824" y="174" fill="#67e8f9" font-family="Consolas, Menlo, monospace" font-size="22">try</text>
  <text x="864" y="174" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">();</text>
  <text x="785" y="216" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="22">}</text>

  <rect x="22" y="270" width="1236" height="8" rx="4" fill="url(#accent)"/>
</svg>