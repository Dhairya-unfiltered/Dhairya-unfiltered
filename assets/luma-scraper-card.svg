<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Luma Scraper — Watch demo</title>
  <desc id="desc">Clickable project card for the Luma Scraper video demo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020304"/>
      <stop offset="1" stop-color="#061218"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="screen"><rect x="28" y="28" width="820" height="504" rx="13"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
