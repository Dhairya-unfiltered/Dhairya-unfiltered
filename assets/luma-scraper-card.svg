  <rect x="920" y="286" width="245" height="3" rx="2" fill="url(#line)"/>
  <circle cx="949" cy="354" r="24" fill="#ff0033"/>
  <path d="M942 341L962 354L942 367Z" fill="#ffffff"/>
  <text x="989" y="362" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700">WATCH DEMO</text>
