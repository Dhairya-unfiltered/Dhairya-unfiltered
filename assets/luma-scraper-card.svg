  <rect x="28" y="28" width="820" height="504" rx="13" fill="none" stroke="#263642" stroke-width="2"/>
  <rect x="876" y="28" width="376" height="504" rx="13" fill="#05080c" fill-opacity="0.93" stroke="#263642"/>
  <text x="920" y="210" fill="#f8fafc" font-family="Consolas, Menlo, monospace" font-size="39" font-weight="700">LUMA</text>
